[package]
name = "commitscope-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "commitscope-daemon"
path = "src/main.rs"

[dependencies]
commitscope-core = { path = "../core" }
getrandom = { version = "=0.4.3", default-features = false }
libc = "=0.2.191"
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
caseless = "=0.2.2"
base64 = "=0.22.1"

[dev-dependencies]
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "sha256", "max-performance"] }
